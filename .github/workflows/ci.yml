name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and data tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check js/core.js && node --check js/data.js
      - name: Run tests
        run: npm test

  e2e:
    name: End-to-end tests (Chromium)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    name: Java API (JUnit + Oracle Database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test against Oracle Database Free (Testcontainers)
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  container:
    name: Container stack smoke test (Oracle + API)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start Oracle and the API with Docker Compose
        run: docker compose up -d --build db api
      - name: Wait for the API to report UP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health | grep -q '"status":"UP"'; then echo "API is up"; exit 0; fi
            sleep 5
          done
          docker compose logs api
          exit 1
      - name: Exercise the API
        run: |
          set -e
          ws=$(curl -fsS -X POST http://localhost:8080/api/workspaces | jq -r .id)
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"phase":"enum","title":"Smoke test","cmd":"echo ok"}' \
            http://localhost:8080/api/workspaces/$ws/commands | jq -e '.id | startswith("w")'
          curl -fsS http://localhost:8080/api/workspaces/$ws | jq -e '.custom | length == 1'
          curl -fsS 'http://localhost:8080/api/commands?port=445' | jq -e 'length > 0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /k8s

  publish:
    name: Publish API image to GHCR
    runs-on: ubuntu-latest
    needs: [container, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/miracaral/foothold-api:latest
            ghcr.io/miracaral/foothold-api:${{ github.sha }}
