# Local stack: Oracle Database Free + the Java API + the static front end.
#   docker compose up --build
#   front end: http://localhost:8000   API: http://localhost:8080/api/commands
services:
  db:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: change-me-system
      APP_USER: foothold
      APP_USER_PASSWORD: foothold
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:oracle:thin:@db:1521/FREEPDB1
      DB_USER: foothold
      DB_PASSWORD: foothold
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./images:/usr/share/nginx/html/images:ro
    ports:
      - "8000:80"
