micronaut.application.name=foothold-api
micronaut.server.port=${PORT:8080}

# The front end is a static page (often opened from file://, Origin "null"), so allow any origin.
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins-regex=^.*$
micronaut.server.cors.configurations.web.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Oracle Database. Override with env vars: DB_URL, DB_USER, DB_PASSWORD.
datasources.default.url=${DB_URL:`jdbc:oracle:thin:@localhost:1521/FREEPDB1`}
datasources.default.username=${DB_USER:foothold}
datasources.default.password=${DB_PASSWORD:foothold}
datasources.default.driver-class-name=oracle.jdbc.OracleDriver
datasources.default.dialect=ORACLE
datasources.default.maximum-pool-size=10

flyway.datasources.default.enabled=true

# /health is used by Kubernetes probes and reports database status.
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.health.details-visible=ANONYMOUS

# Always write empty lists and maps (e.g. "custom": []) so clients never get a missing field.
micronaut.serde.serialization.inclusion=ALWAYS
