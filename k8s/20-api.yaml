apiVersion: v1
kind: Service
metadata:
  name: foothold-api
  namespace: foothold
spec:
  selector:
    app: foothold-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foothold-api
  namespace: foothold
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foothold-api
  template:
    metadata:
      labels:
        app: foothold-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/miracaral/foothold-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:oracle:thin:@oracle:1521/FREEPDB1
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: foothold-db
                  key: APP_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foothold-db
                  key: APP_USER_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
