apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: foothold
spec:
  selector:
    app: oracle
  ports:
    - name: sql
      port: 1521
      targetPort: 1521
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: foothold
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 54321
        runAsGroup: 54321
        fsGroup: 54321
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim-faststart
          ports:
            - containerPort: 1521
          envFrom:
            - secretRef:
                name: foothold-db
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
