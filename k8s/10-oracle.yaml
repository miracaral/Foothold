apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: foothold
spec:
  selector:
    app: oracle
  ports:
    - name: sql
      port: 1521
      targetPort: 1521
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: foothold
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 54321
        runAsGroup: 54321
        fsGroup: 54321
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oracle
          # Not the -faststart tag: it ships ready-made data files in /opt/oracle/oradata,
          # which the volume below would hide (ORA-00205). This image creates them in the volume.
          image: gvenzl/oracle-free:23-slim
          ports:
            - containerPort: 1521
          envFrom:
            - secretRef:
                name: foothold-db
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
