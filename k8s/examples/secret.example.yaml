# Copy to k8s/01-secret.yaml, set real passwords, then `kubectl apply -f k8s/`. Never commit the real file.
# This lives in a subfolder so `kubectl apply -f k8s/` (not recursive) never applies the placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: foothold-db
  namespace: foothold
type: Opaque
stringData:
  ORACLE_PASSWORD: change-me-system
  APP_USER: foothold
  APP_USER_PASSWORD: change-me-app
