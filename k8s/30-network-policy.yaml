# Default deny in the namespace, then open only what the app needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: foothold
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Only the API may reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oracle-from-api
  namespace: foothold
spec:
  podSelector:
    matchLabels:
      app: oracle
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: foothold-api
      ports:
        - port: 1521
---
# The API accepts HTTP from anywhere in the cluster and may only talk to Oracle and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: foothold
spec:
  podSelector:
    matchLabels:
      app: foothold-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: oracle
      ports:
        - port: 1521
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
